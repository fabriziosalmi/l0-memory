<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="logo">🧠 l0-memory</div>
      <div class="subtitle">Offline Web Clipper</div>
    </div>
    
    <div class="form-group">
      <label for="key">Memory Key</label>
      <input type="text" id="key" placeholder="e.g. caddy-waf-setup" required>
    </div>

    <div class="form-group">
      <label for="value">Content / Note</label>
      <textarea id="value" rows="4" placeholder="Enter memory content..." required></textarea>
    </div>

    <div class="row">
      <div class="form-group half">
        <label for="scope">Scope</label>
        <input type="text" id="scope" value="web" placeholder="web">
      </div>
      <div class="form-group half">
        <label for="tags">Tags</label>
        <input type="text" id="tags" placeholder="comma, separated">
      </div>
    </div>

    <div class="form-group">
      <label for="origin">Origin (URL)</label>
      <input type="text" id="origin" readonly>
    </div>

    <div class="form-group">
      <label for="token">Server token</label>
      <input type="password" id="token" placeholder="paste the token printed by `ltm serve`">
    </div>

    <button id="save-btn">Save to Memory</button>
    <div id="status" class="status-msg"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
