name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  server:
    name: server (${{ matrix.os }} / go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.22.x', '1.23.x']
        # Go 1.22's darwin linker emits test binaries without an LC_UUID load
        # command, which the dyld on current `macos-latest` images aborts
        # (`signal: abort trap` before any test runs). Go 1.23+ is fine. Keep
        # macOS + go 1.22 coverage by pinning that one combo to macos-14, whose
        # dyld still accepts the binary.
        exclude:
          - os: macos-latest
            go: '1.22.x'
        include:
          - os: macos-14
            go: '1.22.x'
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: server/go.sum
      - run: go vet ./...
      - run: go build -v ./...
      - name: Test (race, except Windows)
        if: runner.os != 'Windows'
        run: go test -count=1 -race -timeout 90s ./...
      - name: Test (no race on Windows)
        if: runner.os == 'Windows'
        run: go test -count=1 -timeout 90s ./...

  extension:
    name: extension (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20.x', '22.x']
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - run: npm run compile
      - name: Lint package.json
        run: |
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'))"
